<article class="h-full rounded-xl border border-slate-200 bg-white p-5 shadow-sm transition hover:-translate-y-0.5 hover:shadow-md">
  <div class="mb-4 flex items-center gap-3">
    <div class="flex h-11 w-11 items-center justify-center rounded-full bg-indigo-100 font-semibold text-indigo-700">
      {{ user().name.charAt(0) }}
    </div>
    <div>
      <h2 class="font-semibold text-slate-800">{{ user().name }}</h2>
      <p class="text-sm text-slate-400">&#64;{{ user().username }}</p>
    </div>
  </div>

  <dl class="space-y-1.5 text-sm">
    <div class="flex gap-2">
      <dt class="w-16 shrink-0 text-slate-400">Correo</dt>
      <dd class="truncate text-slate-700">{{ user().email }}</dd>
    </div>
    <div class="flex gap-2">
      <dt class="w-16 shrink-0 text-slate-400">Teléfono</dt>
      <dd class="text-slate-700">{{ user().phone }}</dd>
    </div>
    <div class="flex gap-2">
      <dt class="w-16 shrink-0 text-slate-400">Web</dt>
      <dd>
        <a
          [href]="'https://' + user().website"
          target="_blank"
          class="text-indigo-600 hover:underline"
        >
          {{ user().website }}
        </a>
      </dd>
    </div>
  </dl>
</article>
