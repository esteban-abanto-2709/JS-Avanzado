<section class="page">
   <header>
        <h1>Users Api</h1>
        <p>Buscando usuarios utilizando JSONPlaceholder</p>
    </header>
    <div class="search">
    <input
    #queryInput
    type="text"
    [value]="query()"
    (input)="query.set(queryInput.value)"
    placeholder="Buscar usuarios">

    <button
    type="button"
    (click)= "search()"
    >
     Buscar Usuarios
    </button>
    </div>
  <div class="users">
   @for(user of store.users(); track user.id){
      <article>
         <h2>
            {{user.name}}
         </h2>
         <p>
            {{user.username}}
         </p>
         <p>
            {{user.email}}
         </p>
         <p>
            {{user.phone}}
         </p>
         <a
         [href]="'https://' + user.website"
         target="_blank">
         {{user.website}}
        </a>
      </article>
   }
  </div>

</section>
