<section class="min-h-screen bg-slate-50 px-6 py-10">
  <div class="mx-auto max-w-5xl">
    <header class="mb-8">
      <h1 class="text-3xl font-semibold text-slate-800">Usuarios</h1>
      <p class="mt-1 text-slate-500">Buscando usuarios utilizando JSONPlaceholder</p>
    </header>

    <div class="mb-8 flex gap-3">
      <input
        #queryInput
        type="text"
        [value]="query()"
        (input)="query.set(queryInput.value)"
        (keydown.enter)="search()"
        placeholder="Buscar usuarios"
        class="flex-1 rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-slate-700 shadow-sm outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100"
      />
      <button
        type="button"
        (click)="search()"
        class="cursor-pointer rounded-lg bg-indigo-600 px-5 py-2.5 font-medium text-white shadow-sm transition hover:bg-indigo-700"
      >
        Buscar
      </button>
    </div>

    <div class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3">
      @for (user of store.users(); track user.id) {
        <app-user-card [user]="user" />
      } @empty {
        <p class="col-span-full py-10 text-center text-slate-400">No se encontraron usuarios</p>
      }
    </div>
  </div>
</section>
