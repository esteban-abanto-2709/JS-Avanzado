<section class="min-h-screen bg-slate-50 px-6 py-10">
  <div class="mx-auto max-w-5xl">
    <header class="mb-8">
      <h1 class="text-3xl font-semibold text-slate-800">Empleados</h1>
      <p class="mt-1 text-slate-500">Personal de la empresa (datos simulados)</p>
    </header>

    <div class="overflow-x-auto rounded-xl border border-slate-200 bg-white shadow-sm">
      <table class="w-full text-left text-sm">
        <thead class="bg-slate-50 text-slate-500">
          <tr>
            <th class="px-5 py-3 font-medium">Nombre</th>
            <th class="px-5 py-3 font-medium">Cargo</th>
            <th class="px-5 py-3 font-medium">Área</th>
            <th class="px-5 py-3 font-medium">Correo</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100">
          @for (employee of employees; track employee.id) {
            <tr class="hover:bg-slate-50">
              <td class="px-5 py-3 font-medium text-slate-800">{{ employee.fullName }}</td>
              <td class="px-5 py-3 text-slate-600">{{ employee.position }}</td>
              <td class="px-5 py-3">
                <span class="rounded-full bg-indigo-50 px-2.5 py-1 text-xs font-medium text-indigo-700">{{ employee.area }}</span>
              </td>
              <td class="px-5 py-3 text-slate-600">{{ employee.email }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</section>
